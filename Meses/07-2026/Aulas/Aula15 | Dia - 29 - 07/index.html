<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>
  </head>
  <body>
    <form>
      Escreva seu nome:
      <input type="text" placeholder="escreva seu nome aqui" />
      <br /><br />
      Escreva seu email:
      <input type="email" placeholder="escreva seu email" />
      <br /><br />
      Escreva sua senha
      <input type="password" placeholder="escreva sua senha" />
      <br /><br />
      Escreva sua data de nascimento:
      <input type="date" />
      <br /><br />
      escreva sua opnião
      <textarea rows="10"></textarea>
      <br /><br />
      <button type="submit">Eviar form</button>
      <br /><br />
      <button type="reset">Apagar form</button>
      <br /><br />
      <button type="button">Um botao</button>
      <br /><br />

      <span>masculino</span>
      <input type="radio" name="genero" value="masculino" />
      <br /><br />
      <span>feminino</span>
      <input type="radio" name="genero" value="feminino" />
      <br /><br />
      <span>outro</span>
      <input type="radio" name="genero" value="outro" />
      <br><br>
      <div>Aceite os termos</div>
      <input type="checkbox" name="acepta" value="1">
    </form>
  </body>
</html>
