<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      href="https://www.atribuna.com.br/assets/atribuna/favicons/16x16.png"
      sizes="16x16"
    />
    <link
      rel="stylesheet"
      href="https://ka-f.webawesome.com/webawesome@3.10.0/styles/themes/default.css"
    />
    <script
      type="module"
      src="https://ka-f.webawesome.com/webawesome@3.10.0/webawesome.loader.js"
    ></script>
    <link
      rel="stylesheet"
      href="https://ka-f.webawesome.com/webawesome@3.10.0/styles/native.css"
    />
    <title>A Tribuna</title>
  </head>
  <body>
    <section id="barra-login">
      <div id="redes-sociais">
        <div class="icon">
          <wa-icon name="facebook" family="brands"></wa-icon>
        </div>
        <div class="icon">
          <wa-icon name="instagram" family="brands"></wa-icon>
        </div>
        <div class="icon">
          <wa-icon name="x-twitter" family="brands"></wa-icon>
        </div>
        <div class="icon">
          <wa-icon name="youtube" family="brands"></wa-icon>
        </div>
        <div class="icon">
          <wa-icon name="whatsapp" family="brands"></wa-icon>
        </div>
      </div>

      <div id="acesso">
        <div class="btn-acesso">
          <button class="btn-vermelho">Assinar</button>
        </div>
        <div class="btn-acesso">
          <button class="btn-vermelho">Club</button>
        </div>
        <div class="btn-login">
          <a href="#">Entrar <wa-icon name="user"></wa-icon></a>
        </div>
      </div>
    </section>

    <section id="header">
      <div id="menu">
        <button><wa-icon name="bars"></wa-icon></button>
        <span>Menu</span>
      </div>
      <div id="logo">
        <img
          src="https://www.atribuna.com.br/assets/atribuna/main-logoATRIBUNA.svg"
        />
        <p>FUNDADO EM 1894 E ONLINE DESDE 1996</p>
      </div>
      <div id="busca">
        <input type="search" placeholder="Oq tu procura?" />
        <wa-icon name="magnifying-glass"></wa-icon>
      </div>
    </section>
    <section id="nav">oi</section>
  </body>
</html>
