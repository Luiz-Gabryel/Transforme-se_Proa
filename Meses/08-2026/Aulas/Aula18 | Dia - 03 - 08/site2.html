<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Samsung Estudantes | Portal Exclusivo</title>
    <!-- Required: default theme + autoloader -->
    <link
      rel="stylesheet"
      href="https://ka-f.webawesome.com/webawesome@3.11.0/styles/themes/default.css"
    />
    <script
      type="module"
      src="https://ka-f.webawesome.com/webawesome@3.11.0/webawesome.loader.js"
    ></script>
    <link
      rel="shortcut icon"
      href="https://samsungbrshop.vtexassets.com/arquivos/ssgFavicon.png"
      type="image/x-icon"
    />

    <!-- Recommended: utility classes ("CSS Utilities") -->
    <link
      rel="stylesheet"
      href="https://ka-f.webawesome.com/webawesome@3.11.0/styles/utilities.css"
    />

    <!-- Optional: CSS reset ("Native Styles") -->
    <link
      rel="stylesheet"
      href="https://ka-f.webawesome.com/webawesome@3.11.0/styles/native.css"
    />

    <link rel="stylesheet" href="style-site2.css" />
  </head>
  <body>
    <div id="barra">
      <img
        id="logo"
        src="https://images.samsung.com/is/image/samsung/assets/global/about-us/brand/logo/300_186_2.png?$568_N_PNG$"
        alt="Samsung Logo"
      />
      <div id="nav">
        <ul>
          <li><a href="#">mobile</a></li>
          <li><a href="#">tv e av</a></li>
          <li><a href="#">eletrodomésticos</a></li>
          <li><a href="#">ar condicionado</a></li>
          <li><a href="#">informática</a></li>
          <li><a href="#">monitor</a></li>
        </ul>
      </div>
      <div id="suporte">
        <button class="icon"><p>Suporte</p></button>
        <button class="icon">
          <wa-icon name="user" variant="regular"></wa-icon>
        </button>
        <button class="icon">
          <wa-icon name="cart-shopping"></wa-icon>
        </button>
        <button class="icon">
          <wa-icon name="magnifying-glass"></wa-icon>
        </button>
      </div>
    </div>

    <div id="hero">
      <img
        src="https://samsungbrshopestudantes.vtexassets.com/assets/vtex.file-manager-graphql/images/a8a271cb-b19d-4741-be6d-b44b48561df4___3fd83d0047e1f3efb6449e96553f158e.png?aspect=true&quality=9"
        alt=""
      />
    </div>

    <div id="categoria">
      <h1 id="titulo">Ofertas por categorias</h1>
      <div id="card">
        <div class="cate">
          <p><wa-icon name="tablet"></wa-icon></p>
          <br />
          <p>Tablet</p>
        </div>
        <div class="cate">
          <wa-icon name="mobile"></wa-icon>
          <br />
          <p>celular</p>
        </div>
        <div class="cate">
          <wa-icon name="headset"></wa-icon>
          <br />
          <p>fone</p>
        </div>
        <div class="cate">
          <wa-icon name="clock"></wa-icon><br />
          <p>relogio</p>
        </div>
      </div>
    </div>
  </body>
</html>
