<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineAULA</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="cabecalho">
      <div class="container">
        <div class="logo">
          <h1>Cine<span class="destaque">AULA</span></h1>
        </div>
        <nav class="menu">
          <ul>
            <li><a href="#">Inicio</a></li>

            <li class="dropdown">
              <a href="#">Filmes ▾</a>
              <ul class="dropdown-content">
                <li><a href="#">Em Cartaz</a></li>
                <li><a href="#">Lançamentos</a></li>
                <li><a href="#">Criticas</a></li>
              </ul>
            </li>
            <li><a href="#">Serie</a></li>
            <li><a href="#">Noticias</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="slider-container">
        <input type="radio" name="slider-radio" id="slide1" checked />
        <input type="radio" name="slider-radio" id="slide2" checked />
        <input type="radio" name="slider-radio" id="slide3" checked />
        <div class="slides">
          <div class="slide primeira">
            <img
              src="https://helios-i.mashable.com/imagery/videos/01Jfq02MTvy2cWxWe8ZUcbd/hero-image.fill.size_1248x702.v1781629102.jpg"
              alt="Imagem"
            />
          </div>
          <div class="slide">
            <img
              src="https://sidneyblaylockjr.wordpress.com/wp-content/uploads/2019/01/4adbe3-20171212-star-wars-last-jedi.jpg"
              alt="Imagem2"
            />
          </div>
          <div class="slide">
            <img
              src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQa1-uM3lIhmdXjyaEaf6UFCpIRuHez7V_BnNeKvUqNnxrUSyGQIZdfBJDg&s=10"
              alt="Imagem3"
            />
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
