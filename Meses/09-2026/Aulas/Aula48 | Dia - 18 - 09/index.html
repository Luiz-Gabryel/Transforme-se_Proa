<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minha Lanchonete</title>
  </head>
  <body>
    <h1>Lanchonete do seu Ze</h1>

    <div id="tela-produtos">
      <div class="item">
        <p>🍔 <strong>Hamburguer</strong> R$ 15,00</p>
        <button onclick="removerHamburguer()">-</button>
        <input type="number" id="qtdhamburguer" value="0" min="0" disabled />
        <button onclick="adicionarHamburguer()">+</button>
      </div>

      <div class="item">
        <p>🍟 <strong>Batata Frita</strong> R$ 10,00</p>
        <button onclick="removerBatata()">-</button>
        <input type="number" id="qtdbatata" value="0" min="0" disabled />
        <button onclick="adicionarBatata()">+</button>
      </div>

      <div class="item">
        <p>🥤 <strong>Refrigerante</strong> R$ 5,00</p>
        <button onclick="removerRefrigerante()">-</button>
        <input type="number" id="qtdrefrigerante" value="0" min="0" disabled />
        <button onclick="adicionarRefrigerante()">+</button>
      </div>

      <br />

      <button onclick="irParaResumo()">Ver resumo do Pedido</button>
    </div>

    <br />

    <div id="tela-resumo">
      <h2>Seu Pedido</h2>

      <ul id="lista-pedido"></ul>

      <h3 id="texto-total">Total: R$ 0,00</h3>

      <button>Editar Pedido</button>
      <button>Novo Pedido</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
